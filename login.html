<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login | MedCore Hospital Engine</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
    
    <script src="firebase-config.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Poppins:wght@300;400;500;600&display=swap');

        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #002B5B 0%, #00B4D8 100%);
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            margin: 0;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .hospital-logo {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .hosp-name {
            font-family: 'Montserrat', sans-serif;
            color: #002B5B;
            font-weight: 800;
            font-size: 1.4rem;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .hosp-slogan {
            color: #00B4D8;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group-custom i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        .form-control-custom {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .form-control-custom:focus {
            outline: none;
            border-color: #00B4D8;
            box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.1);
        }

        .login-btn {
            background: #002B5B;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #00B4D8;
            box-shadow: 0 5px 15px rgba(0, 180, 216, 0.4);
        }

        .login-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="https://via.placeholder.com/100/00B4D8/FFFFFF?text=Logo" id="logoDisplay" class="hospital-logo" alt="Logo">
        <div id="nameDisplay" class="hosp-name">MEDCORE ERP</div>
        <div id="sloganDisplay" class="hosp-slogan">Secure Staff Portal</div>

        <div id="errorMsg" class="alert alert-danger" style="display: none; font-size: 0.85rem; padding: 10px;"></div>

        <form id="loginForm">
            <div class="input-group-custom">
                <i class="fas fa-envelope"></i>
                <input type="email" id="userEmail" class="form-control-custom" placeholder="Staff Email ID" required>
            </div>
            
            <div class="input-group-custom">
                <i class="fas fa-lock"></i>
                <input type="password" id="userPass" class="form-control-custom" placeholder="Password" required>
            </div>

            <button type="submit" id="loginBtn" class="login-btn">
                <i class="fas fa-sign-in-alt me-2"></i> SECURE LOGIN
            </button>
        </form>
        
        <p style="margin-top: 20px; font-size: 0.75rem; color: #888;">Powered by The Lalit Soft Engine</p>
    </div>

<script>
    // 1. Load Branding if available
    const brandDataStr = localStorage.getItem('hospitalBrandData');
    if(brandDataStr) {
        const brand = JSON.parse(brandDataStr);
        document.getElementById('nameDisplay').innerText = brand.hospitalName || "CarePlus Hospital";
        if(brand.logoUrl) document.getElementById('logoDisplay').src = brand.logoUrl;
        if(brand.slogan) document.getElementById('sloganDisplay').innerText = brand.slogan;
    }

    // 2. Initialize Firebase (Tenant Setup)
    const tenantConfigStr = localStorage.getItem('hospitalFirebaseConfig');
    if (!tenantConfigStr) {
        document.getElementById('errorMsg').style.display = 'block';
        document.getElementById('errorMsg').innerText = "System Error: Hospital Server Configuration not found! Contact Super Admin.";
        document.getElementById('loginBtn').disabled = true;
    } else {
        const tenantConfig = JSON.parse(tenantConfigStr);
        let tenantApp;
        try {
            tenantApp = firebase.app("TenantApp");
        } catch(e) {
            tenantApp = firebase.initializeApp(tenantConfig, "TenantApp");
        }
        
        const tenantAuth = tenantApp.auth();
        const tenantDb = tenantApp.firestore();

        // 3. Login Logic
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('userEmail').value.trim();
            const pass = document.getElementById('userPass').value;
            const btn = document.getElementById('loginBtn');
            const errorBox = document.getElementById('errorMsg');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> AUTHENTICATING...';
            errorBox.style.display = 'none';

            try {
                // Step A: Firebase Auth
                const userCredential = await tenantAuth.signInWithEmailAndPassword(email, pass);
                const user = userCredential.user;

                btn.innerHTML = '<i class="fas fa-check-circle me-2"></i> FETCHING ROLE...';

                // Step B: Check Staff Role from Database
                const staffQuery = await tenantDb.collection('staff').where('loginEmail', '==', email).get();
                
                if (staffQuery.empty) {
                    throw new Error("Login successful, but your Staff Profile was not found in the database. Contact Admin.");
                }

                // Step C: Save Data locally & Redirect
                const staffData = staffQuery.docs[0].data();
                
                localStorage.setItem('staffId', staffData.staffID);
                localStorage.setItem('staffRole', staffData.role); // e.g. 'admin', 'doctor', 'reception'
                localStorage.setItem('staffName', staffData.name);

                btn.innerHTML = '<i class="fas fa-door-open me-2"></i> ENTERING PORTAL...';
                
                // Redirect to main software screen
                setTimeout(() => {
                    window.location.href = "index.html"; 
                }, 1000);

            } catch (error) {
                let msg = error.message;
                if(error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    msg = "Invalid Email or Password. Please try again.";
                }
                errorBox.innerText = msg;
                errorBox.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> SECURE LOGIN';
            }
        });
    }
</script>
</body>
</html>
