<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apna Bazar - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .header {
            background: #0f054c;
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .logo-title {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .card-box {
            text-align: center;
        }
        .app-icon {
            width: 60px;
            height: 60px;
            background: #ffcc00;
            border-radius: 12px;
            margin: 0 auto 12px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        h2 {
            font-size: 20px;
            color: #222;
            margin-bottom: 6px;
        }
        p {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .google-btn {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
            transition: background 0.2s;
        }
        .google-btn:hover {
            background: #f8f9fa;
        }
        .divider {
            font-size: 12px;
            color: #888;
            margin-bottom: 16px;
            position: relative;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #111;
            color: #fff;
            border-color: #111;
        }
        .input-group {
            text-align: left;
            margin-bottom: 14px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #ffcc00;
        }
        .forgot-pass {
            text-align: right;
            font-size: 12px;
            color: #0066cc;
            text-decoration: none;
            display: block;
            margin-top: -8px;
            margin-bottom: 14px;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #ffcc00;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .submit-btn:hover {
            background: #e6b800;
        }
        .skip-btn {
            width: 100%;
            padding: 10px;
            background: #f1f3f5;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
        }
        .skip-btn:hover {
            background: #e2e6ea;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <span class="logo-title">APNA BAZAR</span>
            <span style="font-size: 11px; background: rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 4px;">सुरक्षित लॉगिन</span>
        </div>

        <div class="card-box">
            <div class="app-icon">🛒</div>
            <h2>स्वागत है! अपना अकाउंट जोड़ें</h2>
            <p>ऑर्डर ट्रैक करने, उधार खाता देखने या अपनी दुकान चलाने के लिए लॉगिन करें</p>

            <!-- Google Login Button -->
            <button class="google-btn" onclick="handleGoogleLogin()">
                <span style="color: #4285F4; font-weight: bold;">G</span> 1-Click में Google से लॉगिन करें (सबसे तेज़)
            </button>

            <div class="divider">या ईमेल व पासवर्ड से</div>

            <!-- Tabs -->
            <div class="btn-group">
                <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">🔑 लॉगिन</button>
                <button class="tab-btn" id="registerTab" onclick="switchTab('register')">👤 नया अकाउंट</button>
                <button class="tab-btn" onclick="handleNewShop()">🏪 नई दुकान</button>
            </div>

            <!-- Form -->
            <form id="authForm" onsubmit="handleSubmit(event)">
                <div class="input-group">
                    <label>ईमेल आईडी (Email Address) *</label>
                    <input type="email" id="email" placeholder="example@gmail.com" required>
                </div>

                <div class="input-group">
                    <label>पासवर्ड (Password) *</label>
                    <input type="password" id="password" placeholder="कम से कम 6 अक्षर का पासवर्ड" required>
                </div>
                <a href="#" class="forgot-pass" onclick="handleForgot(event)">पासवर्ड भूल गए?</a>

                <button type="submit" class="submit-btn" id="submitBtnText">लॉगिन करें (CONTINUE) →</button>
            </form>

            <!-- Skip Button -->
            <button class="skip-btn" onclick="handleSkip()">बिना लॉगिन के खरीदारी जारी रखें (Skip to Bazar) →</button>
        </div>
    </div>

    <script>
        let currentMode = 'login';

        function handleGoogleLogin() {
            alert("Google Login par click kiya gaya hai!");
        }

        function switchTab(mode) {
            currentMode = mode;
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const submitBtn = document.getElementById('submitBtnText');

            if (mode === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                submitBtn.innerText = "लॉगिन करें (CONTINUE) →";
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                submitBtn.innerText = "अकाउंट बनाएँ (REGISTER) →";
            }
        }

        function handleNewShop() {
            alert("Nayi dukan banane ka option khul raha hai!");
        }

        function handleForgot(e) {
            e.preventDefault();
            alert("Password reset link aapke email par bheja jayega.");
        }

        function handleSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            if (currentMode === 'login') {
                alert("Login successful for: " + email);
            } else {
                alert("Account created successfully for: " + email);
            }
        }

        function handleSkip() {
            alert("Aap bina login ke aage badh rahe hain.");
        }
    </script>
</body>
</html>
